
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON ESCAPE</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:12px;background:#080b19;color:white;
 font-family:Arial,sans-serif;text-align:center
}
h1{
 color:#00e5ff;font-size:32px;
 text-shadow:0 0 18px #00e5ff
}
.stats{
 display:flex;justify-content:center;gap:8px;
 flex-wrap:wrap;margin:12px
}
.stat{
 background:#171e38;padding:11px 14px;
 border-radius:12px;border:1px solid #394d78
}
canvas{
 width:min(94vw,500px);height:auto;display:block;
 margin:15px auto;border:2px solid #00e5ff;
 border-radius:15px;box-shadow:0 0 25px #00e5ff55;
 background:#080d27
}
button{
 padding:12px 16px;margin:5px;background:#152b53;
 color:white;border:1px solid #00e5ff;
 border-radius:10px;font-size:15px;
 cursor:pointer;touch-action:none
}
button:active{background:#007fbd}
.controls{
 display:flex;justify-content:center;gap:35px;margin:15px
}
.controls button{width:110px;font-size:28px}
#message{color:#00e5ff;font-size:19px}
#shapeName{color:#bd5cff}
#shieldTimer{color:#00e5ff}
#speedTimer{color:#ffd700}
.level-menu{position:relative;display:inline-block}
.level-options{
 display:none;position:absolute;top:100%;left:50%;
 transform:translateX(-50%);background:#171e38;
 border:1px solid #00e5ff;border-radius:12px;
 padding:8px;width:150px;z-index:10
}
.level-options.show{display:block}
.level-options button{display:block;width:100%}
</style>
</head>

<body>

<h1>🌌 NEON ESCAPE</h1>
<p>تجنب العقبات واجمع العملات وحطم رقمك القياسي!</p>

<div class="stats">
 <div class="stat">⭐ النقاط: <span id="score">0</span></div>
 <div class="stat">🏆 الأفضل: <span id="best">0</span></div>
 <div class="stat">🪙 العملات: <span id="coins">0</span></div>
 <div class="stat">🛡️ الدرع: <span id="shieldTimer">لا</span></div>
 <div class="stat">⚡ السرعة: <span id="speedTimer">عادي</span></div>
</div>

<div class="level-menu">
 <button onclick="toggleLevels()">🎮 المستويات</button>
 <div class="level-options" id="levelOptions">
  <button onclick="chooseDifficulty('easy')">🟢 سهل</button>
  <button onclick="chooseDifficulty('medium')">🟡 متوسط</button>
  <button onclick="chooseDifficulty('hard')">🔴 صعب</button>
 </div>
</div>

<p>المستوى: <span id="levelName">سهل</span></p>

<canvas id="game" width="500" height="500"></canvas>

<h3 id="message">اختر شخصيتك وابدأ اللعب!</h3>

<p>الشخصية: <span id="shapeName">المربع الأزرق</span></p>

<div>
 <button onclick="changeShape()">🎨 تغيير الشخصية</button>
 <button onclick="toggleMusic()" id="musicButton">🔊 إيقاف الموسيقى</button>
</div>

<div>
 <button onclick="startGame()">▶️ ابدأ اللعب</button>
 <button onclick="togglePause()" id="pauseButton">⏸️ إيقاف مؤقت</button>
 <button onclick="shareGame()">📲 مشاركة</button>
</div>

<div class="controls">
 <button id="left">⬅️</button>
 <button id="right">➡️</button>
</div>

<p>الكمبيوتر: الأسهم أو A و D</p>
<p>الموبايل: استخدم أزرار الحركة</p>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const $=id=>document.getElementById(id);

let player;
let obstacles=[];
let stars=[];
let shields=[];
let coinsItems=[];
let speedItems=[];
let particles=[];

let score=0;
let coins=0;
let spawnCounter=0;
let running=false;
let paused=false;
let animation=null;

let shieldActive=false;
let shieldEndTime=0;
let nextShieldTime=0;

let speedActive=false;
let speedEndTime=0;
let nextSpeedTime=0;

let leftPressed=false;
let rightPressed=false;
let shake=0;

let best=Number(localStorage.getItem("neonBest"))||0;
$("best").textContent=best;

const difficulties={
 easy:{name:"سهل",speed:2.5,spawn:85},
 medium:{name:"متوسط",speed:4,spawn:60},
 hard:{name:"صعب",speed:6,spawn:42}
};

let currentDifficulty="easy";

const shapes=[
 {name:"المربع الأزرق",color:"#00e5ff",type:"square"},
 {name:"الدائرة البنفسجية",color:"#bd5cff",type:"circle"},
 {name:"النجمة الذهبية",color:"#ffd700",type:"star"},
 {name:"الماسة الخضراء",color:"#00ff99",type:"diamond"}
];

let selectedShape=0;

for(let i=0;i<85;i++){
 stars.push({
  x:Math.random()*500,
  y:Math.random()*500,
  size:Math.random()*2+0.5,
  speed:Math.random()*0.8+0.2
 });
}

// الصوت والموسيقى

let audioContext=null;
let musicTimer=null;
let musicEnabled=true;
let noteIndex=0;

const melody=[
 261.63,329.63,392,329.63,
 293.66,349.23,440,349.23,
 261.63,329.63,392,523.25,
 440,392,329.63,293.66
];

function initAudio(){
 if(!audioContext){
  audioContext=new(window.AudioContext||window.webkitAudioContext)();
 }
 if(audioContext.state==="suspended")audioContext.resume();
}

function playTone(freq,duration,volume,type="sine"){
 if(!audioContext)return;

 const osc=audioContext.createOscillator();
 const gain=audioContext.createGain();

 osc.type=type;
 osc.frequency.value=freq;
 gain.gain.setValueAtTime(volume,audioContext.currentTime);
 gain.gain.exponentialRampToValueAtTime(
  0.001,audioContext.currentTime+duration
 );

 osc.connect(gain);
 gain.connect(audioContext.destination);
 osc.start();
 osc.stop(audioContext.currentTime+duration);
}

function startMusic(){
 if(!musicEnabled||musicTimer)return;

 musicTimer=setInterval(()=>{
  if(running&&!paused){
   playTone(melody[noteIndex%melody.length],0.3,0.025);
   noteIndex++;
  }
 },320);
}

function stopMusic(){
 clearInterval(musicTimer);
 musicTimer=null;
}

function toggleMusic(){
 musicEnabled=!musicEnabled;

 $("musicButton").textContent=musicEnabled?
 "🔊 إيقاف الموسيقى":"🔇 تشغيل الموسيقى";

 if(musicEnabled){
  initAudio();
  if(running&&!paused)startMusic();
 }else stopMusic();
}

function deathSound(){
 initAudio();
 playTone(350,0.3,0.12,"sawtooth");
 setTimeout(()=>playTone(180,0.5,0.1),180);
}

function toggleLevels(){
 $("levelOptions").classList.toggle("show");
}

function chooseDifficulty(level){
 currentDifficulty=level;
 $("levelName").textContent=difficulties[level].name;
 $("levelOptions").classList.remove("show");
 $("message").textContent="المستوى الحالي: "+difficulties[level].name;
}

function changeShape(){
 if(running)return;
 selectedShape=(selectedShape+1)%shapes.length;
 $("shapeName").textContent=shapes[selectedShape].name;
 drawPreview();
}

// الخلفية

function drawBackground(){
 const bg=ctx.createLinearGradient(0,0,0,500);
 bg.addColorStop(0,"#080d27");
 bg.addColorStop(0.5,"#14244b");
 bg.addColorStop(1,"#07101e");

 ctx.fillStyle=bg;
 ctx.fillRect(0,0,500,500);

 for(const star of stars){
  if(running&&!paused){
   star.y+=star.speed;
   if(star.y>500){
    star.y=0;
    star.x=Math.random()*500;
   }
  }

  ctx.fillStyle="rgba(255,255,255,0.8)";
  ctx.beginPath();
  ctx.arc(star.x,star.y,star.size,0,Math.PI*2);
  ctx.fill();
 }

 ctx.strokeStyle="rgba(0,229,255,0.3)";
 ctx.lineWidth=2;
 ctx.strokeRect(8,0,484,500);
}

function drawStar(x,y,size){
 ctx.beginPath();
 for(let i=0;i<10;i++){
  const r=i%2===0?size:size/2;
  const a=i*Math.PI/5-Math.PI/2;
  const px=x+Math.cos(a)*r;
  const py=y+Math.sin(a)*r;
  if(i===0)ctx.moveTo(px,py);
  else ctx.lineTo(px,py);
 }
 ctx.closePath();
 ctx.fill();
}

// الجزيئات والمؤثرات

function createParticles(x,y,color,count=15){
 for(let i=0;i<count;i++){
  const angle=Math.random()*Math.PI*2;
  const speed=Math.random()*5+1;

  particles.push({
   x,y,
   vx:Math.cos(angle)*speed,
   vy:Math.sin(angle)*speed,
   life:35,
   color,
   size:Math.random()*4+2
  });
 }
}

function drawParticles(){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];

  p.x+=p.vx;
  p.y+=p.vy;
  p.vy+=0.04;
  p.life--;

  ctx.globalAlpha=Math.max(0,p.life/35);
  ctx.fillStyle=p.color;
  ctx.shadowColor=p.color;
  ctx.shadowBlur=12;

  ctx.beginPath();
  ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
  ctx.fill();

  if(p.life<=0)particles.splice(i,1);
 }
 ctx.globalAlpha=1;
 ctx.shadowBlur=0;
}

// اللاعب

function drawPlayer(){
 const shape=shapes[selectedShape];
 const x=player.x;
 const y=player.y;

 ctx.save();
 ctx.fillStyle=shape.color;
 ctx.shadowColor=shape.color;
 ctx.shadowBlur=22;

 if(shape.type==="square"){
  ctx.fillRect(x,y,50,50);
 }

 if(shape.type==="circle"){
  ctx.beginPath();
  ctx.arc(x+25,y+25,25,0,Math.PI*2);
  ctx.fill();
 }

 if(shape.type==="star"){
  drawStar(x+25,y+25,27);
 }

 if(shape.type==="diamond"){
  ctx.beginPath();
  ctx.moveTo(x+25,y);
  ctx.lineTo(x+50,y+25);
  ctx.lineTo(x+25,y+50);
  ctx.lineTo(x,y+25);
  ctx.closePath();
  ctx.fill();
 }

 ctx.restore();

 if(shieldActive){
  ctx.save();
  ctx.strokeStyle="#00e5ff";
  ctx.lineWidth=4;
  ctx.shadowColor="#00e5ff";
  ctx.shadowBlur=25;

  ctx.beginPath();
  ctx.arc(
   x+25,y+25,
   37+Math.sin(Date.now()/100)*3,
   0,Math.PI*2
  );
  ctx.stroke();
  ctx.restore();
 }

 if(speedActive){
  ctx.save();
  ctx.strokeStyle="#ffd700";
  ctx.lineWidth=3;
  ctx.shadowColor="#ffd700";
  ctx.shadowBlur=15;
  ctx.beginPath();
  ctx.arc(x+25,y+25,33,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();
 }
}

// العقبات

function createObstacle(){
 obstacles.push({
  x:Math.random()*455,
  y:-45,
  width:40,
  height:40,
  color:Math.random()<0.5?"#ff365e":"#ff7b36"
 });
}

function drawObstacles(){
 for(const o of obstacles){
  ctx.save();
  ctx.fillStyle=o.color;
  ctx.shadowColor=o.color;
  ctx.shadowBlur=18;
  ctx.fillRect(o.x,o.y,o.width,o.height);
  ctx.restore();
 }
}

// المكافآت

function createShield(){
 shields.push({x:15+Math.random()*430,y:-40,width:36,height:36});
}

function createCoin(){
 coinsItems.push({
  x:25+Math.random()*430,
  y:-30,
  width:25,
  height:25
 });
}

function createSpeed(){
 speedItems.push({
  x:25+Math.random()*430,
  y:-35,
  width:32,
  height:32
 });
}

function drawRewards(){
 for(const item of shields){
  ctx.save();
  ctx.translate(item.x+18,item.y+18);
  ctx.shadowColor="#00e5ff";
  ctx.shadowBlur=25;
  ctx.strokeStyle="#00e5ff";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(0,-16);
  ctx.lineTo(14,-9);
  ctx.lineTo(11,7);
  ctx.lineTo(0,17);
  ctx.lineTo(-11,7);
  ctx.lineTo(-14,-9);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
 }

 for(const c of coinsItems){
  ctx.save();
  ctx.fillStyle="#ffd700";
  ctx.shadowColor="#ffd700";
  ctx.shadowBlur=20;
  ctx.beginPath();
  ctx.arc(c.x+12,c.y+12,12,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#8b5c00";
  ctx.font="bold 15px Arial";
  ctx.textAlign="center";
  ctx.fillText("$",c.x+12,c.y+17);
  ctx.restore();
 }

 for(const s of speedItems){
  ctx.save();
  ctx.fillStyle="#bd5cff";
  ctx.shadowColor="#bd5cff";
  ctx.shadowBlur=22;
  ctx.font="bold 34px Arial";
  ctx.fillText("⚡",s.x,s.y+30);
  ctx.restore();
 }
}

function activateShield(){
 shieldActive=true;
 shieldEndTime=Date.now()+10000;
 $("shieldTimer").textContent="10 ث";
 $("message").textContent="🛡️ درع الحماية مفعل!";
 playTone(700,0.25,0.08);
 createParticles(player.x+25,player.y+25,"#00e5ff",20);
}

function activateSpeed(){
 speedActive=true;
 speedEndTime=Date.now()+6000;
 $("speedTimer").textContent="6 ث";
 $("message").textContent="⚡ سرعة خارقة!";
 playTone(850,0.25,0.08);
 createParticles(player.x+25,player.y+25,"#ffd700",20);
}

function updateTimers(){
 const now=Date.now();

 if(shieldActive){
  const remaining=shieldEndTime-now;
  if(remaining<=0){
   shieldActive=false;
   $("shieldTimer").textContent="لا";
  }else{
   $("shieldTimer").textContent=Math.ceil(remaining/1000)+" ث";
  }
 }

 if(speedActive){
  const remaining=speedEndTime-now;
  if(remaining<=0){
   speedActive=false;
   $("speedTimer").textContent="عادي";
  }else{
   $("speedTimer").textContent=Math.ceil(remaining/1000)+" ث";
  }
 }
}

// التصادم

function collision(a,b){
 return(
  a.x<b.x+b.width&&
  a.x+a.width>b.x&&
  a.y<b.y+b.height&&
  a.y+a.height>b.y
 );
}

// التحكم

document.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();

 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")leftPressed=true;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")rightPressed=true;

 if(e.key===" "&&!e.repeat)togglePause();
});

document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")leftPressed=false;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")rightPressed=false;
});

function holdButton(id,direction){
 const btn=$(id);

 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(direction==="left")leftPressed=true;
  else rightPressed=true;
 });

 function release(){
  if(direction==="left")leftPressed=false;
  else rightPressed=false;
 }

 btn.addEventListener("pointerup",release);
 btn.addEventListener("pointerleave",release);
 btn.addEventListener("pointercancel",release);
}

holdButton("left","left");
holdButton("right","right");

// شاشة النهاية

function endGame(){
 if(!running)return;

 running=false;
 paused=false;
 shieldActive=false;
 speedActive=false;

 stopMusic();
 deathSound();

 leftPressed=false;
 rightPressed=false;

 $("shieldTimer").textContent="لا";
 $("speedTimer").textContent="عادي";
 $("pauseButton").textContent="⏸️ إيقاف مؤقت";

 let newRecord=false;

 if(score>best){
  best=score;
  localStorage.setItem("neonBest",best);
  $("best").textContent=best;
  newRecord=true;
 }

 $("message").textContent=newRecord?
 "🏆 رقم قياسي جديد!":"💀 انتهت اللعبة!";

 drawBackground();
 drawObstacles();
 drawRewards();
 drawPlayer();

 ctx.fillStyle="rgba(0,0,0,0.78)";
 ctx.fillRect(0,0,500,500);

 ctx.textAlign="center";
 ctx.fillStyle="#ff365e";
 ctx.font="bold 40px Arial";
 ctx.fillText("GAME OVER",250,205);

 ctx.fillStyle="white";
 ctx.font="23px Arial";
 ctx.fillText("Your Score: "+score,250,260);
 ctx.fillText("Coins: "+coins,250,300);

 if(newRecord){
  ctx.fillStyle="#ffd700";
  ctx.font="bold 23px Arial";
  ctx.fillText("NEW RECORD!",250,350);
 }
}

// الإيقاف المؤقت

function togglePause(){
 if(!running)return;

 paused=!paused;
 leftPressed=false;
 rightPressed=false;

 if(paused){
  cancelAnimationFrame(animation);
  stopMusic();
  $("pauseButton").textContent="▶️ استكمال";
  $("message").textContent="⏸️ اللعبة متوقفة مؤقتاً";

  ctx.fillStyle="rgba(0,0,0,0.7)";
  ctx.fillRect(0,0,500,500);
  ctx.textAlign="center";
  ctx.fillStyle="#00e5ff";
  ctx.font="bold 42px Arial";
  ctx.fillText("PAUSED",250,245);
 }else{
  $("pauseButton").textContent="⏸️ إيقاف مؤقت";
  $("message").textContent="🔥 أكمل التحدي!";
  update();
  startMusic();
 }
}

// تحديث اللعبة

function update(){
 if(!running||paused)return;

 ctx.save();

 if(shake>0){
  ctx.translate(
   (Math.random()-0.5)*shake,
   (Math.random()-0.5)*shake
  );
  shake*=0.85;
  if(shake<0.5)shake=0;
 }

 drawBackground();
 updateTimers();

 const speed=speedActive?12:7;

 if(leftPressed)player.x-=speed;
 if(rightPressed)player.x+=speed;

 player.x=Math.max(0,Math.min(450,player.x));

 spawnCounter++;

 const difficulty=difficulties[currentDifficulty];

 if(spawnCounter>=difficulty.spawn){
  createObstacle();
  spawnCounter=0;
 }

 if(Date.now()>=nextShieldTime){
  createShield();
  nextShieldTime=Date.now()+15000+Math.random()*5000;
 }

 if(Date.now()>=nextSpeedTime){
  if(Math.random()<0.65)createSpeed();
  nextSpeedTime=Date.now()+18000+Math.random()*7000;
 }

 // ظهور العملات

 if(Math.random()<0.018)createCoin();

 // العقبات

 for(let i=obstacles.length-1;i>=0;i--){
  const o=obstacles[i];
  o.y+=difficulty.speed;

  if(collision(player,o)){
   if(shieldActive){
    createParticles(o.x+20,o.y+20,"#00e5ff",18);
    obstacles.splice(i,1);
    shake=5;
   }else{
    shake=15;
    createParticles(player.x+25,player.y+25,"#ff365e",35);
    ctx.restore();
    endGame();
    return;
   }
  }
 }

 // الدرع

 for(let i=shields.length-1;i>=0;i--){
  const s=shields[i];
  s.y+=difficulty.speed;

  if(collision(player,s)){
   activateShield();
   shields.splice(i,1);
  }
 }

 // العملات

 for(let i=coinsItems.length-1;i>=0;i--){
  const c=coinsItems[i];
  c.y+=difficulty.speed;

  if(collision(player,c)){
   coins++;
   score+=5;
   $("coins").textContent=coins;
   $("score").textContent=score;
   createParticles(c.x+12,c.y+12,"#ffd700",20);
   playTone(950,0.12,0.07);
   coinsItems.splice(i,1);
  }
 }

 // السرعة

 for(let i=speedItems.length-1;i>=0;i--){
  const s=speedItems[i];
  s.y+=difficulty.speed;

  if(collision(player,s)){
   activateSpeed();
   speedItems.splice(i,1);
  }
 }

 obstacles=obstacles.filter(o=>{
  if(o.y>=500){
   score++;
   $("score").textContent=score;
   return false;
  }
  return true;
 });

 shields=shields.filter(s=>s.y<500);
 coinsItems=coinsItems.filter(c=>c.y<500);
 speedItems=speedItems.filter(s=>s.y<500);

 drawRewards();
 drawObstacles();
 drawParticles();
 drawPlayer();

 ctx.restore();

 animation=requestAnimationFrame(update);
}

// بداية اللعبة

function startGame(){
 initAudio();

 cancelAnimationFrame(animation);
 stopMusic();

 player={x:225,y:430,width:50,height:50};

 obstacles=[];
 shields=[];
 coinsItems=[];
 speedItems=[];
 particles=[];

 score=0;
 coins=0;
 spawnCounter=0;

 shieldActive=false;
 speedActive=false;

 nextShieldTime=Date.now()+5000;
 nextSpeedTime=Date.now()+12000;

 $("shieldTimer").textContent="لا";
 $("speedTimer").textContent="عادي";

 leftPressed=false;
 rightPressed=false;
 shake=0;

 running=true;
 paused=false;

 $("score").textContent="0";
 $("coins").textContent="0";
 $("message").textContent="🔥 حاول تحطم رقمك القياسي!";
 $("pauseButton").textContent="⏸️ إيقاف مؤقت";

 update();
 startMusic();
}

// المشاركة

function shareGame(){
 const gameUrl=window.location.href;

 if(gameUrl.startsWith("file:")){
  alert("ارفع اللعبة على GitHub Pages أولاً!");
  return;
 }

 const text="جرّب لعبة NEON ESCAPE! 🌌🎮\n"+gameUrl;
 const url="https://wa.me/?text="+encodeURIComponent(text);

 window.open(url,"_blank");
}

// شاشة البداية

function drawPreview(){
 player={x:225,y:225,width:50,height:50};
 drawBackground();
 drawPlayer();
}

drawPreview();

</script>
</body>
</html>
