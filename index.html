
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COSMIC DASH</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #050817;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
}

h1 {
  color: #00eaff;
  font-size: 36px;
  text-shadow: 0 0 15px #00eaff;
  margin: 18px 0 5px;
  letter-spacing: 3px;
}

.subtitle {
  color: #a8b8d8;
  margin-bottom: 12px;
}

.info {
  display: flex;
  justify-content: center;
  gap: 35px;
  margin: 12px;
  font-size: 18px;
}

.info span {
  color: #00eaff;
  font-weight: bold;
}

canvas {
  display: block;
  margin: 12px auto;
  width: min(92vw, 420px);
  height: auto;
  background: #080d25;
  border: 2px solid #00d9ff;
  border-radius: 12px;
  box-shadow: 0 0 22px #00bfff55;
  touch-action: none;
}

button {
  border: 1px solid #00eaff;
  background: #101b3b;
  color: white;
  padding: 11px 18px;
  margin: 5px;
  border-radius: 9px;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #073e59;
  box-shadow: 0 0 12px #00eaff;
}

.shapes {
  margin: 8px;
}

.shapes button {
  font-size: 20px;
  padding: 8px 13px;
}

.selected {
  background: #07516b;
  box-shadow: 0 0 12px #00eaff;
}

.controls {
  margin: 10px;
}

.controls button {
  width: 90px;
  font-size: 22px;
  touch-action: none;
}

footer {
  color: #687a9e;
  font-size: 12px;
  margin: 18px;
}
</style>
</head>

<body>

<h1>COSMIC DASH</h1>
<div class="subtitle">Dodge the obstacles. Beat your record!</div>

<div class="info">
  <div>Score: <span id="score">0</span></div>
  <div>Best: <span id="best">0</span></div>
</div>

<div class="shapes">
  <button onclick="chooseShape('square',this)" class="selected">■</button>
  <button onclick="chooseShape('circle',this)">●</button>
  <button onclick="chooseShape('diamond',this)">◆</button>
  <button onclick="chooseShape('star',this)">★</button>
</div>

<canvas id="game" width="420" height="560"></canvas>

<div>
  <button onclick="startGame()">▶ ابدأ اللعب</button>
  <button onclick="toggleMusic()" id="musicButton">🔊 الموسيقى</button>
</div>

<div class="controls">
  <button id="leftBtn">⬅</button>
  <button id="rightBtn">➡</button>
</div>

<footer>COSMIC DASH © 2026</footer>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");

let score = 0;
let best = Number(localStorage.getItem("cosmicBest")) || 0;
bestText.textContent = best;

let playing = false;
let gameOver = false;

let player = {
  x: 190,
  y: 490,
  size: 30,
  speed: 5
};

let obstacles = [];
let stars = [];
let frame = 0;
let keys = {};
let selectedShape = "square";

let audio;
let musicTimer;
let musicOn = true;

// إنشاء النجوم
for (let i = 0; i < 65; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2 + 0.5,
    speed: Math.random() * 1.5 + 0.3
  });
}

// الصوت والموسيقى
function initAudio() {
  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audio.state === "suspended") audio.resume();
}

function playTone(freq, duration, type = "sine", volume = 0.04) {
  if (!audio) return;

  const osc = audio.createOscillator();
  const gain = audio.createGain();

  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = volume;

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audio.currentTime + duration
  );

  osc.stop(audio.currentTime + duration);
}

function startMusic() {
  stopMusic();
  if (!musicOn) return;

  const notes = [262, 330, 392, 330, 294, 349, 440, 349];
  let i = 0;

  musicTimer = setInterval(() => {
    if (playing && musicOn) {
      playTone(notes[i % notes.length], 0.18, "triangle", 0.018);
      i++;
    }
  }, 260);
}

function stopMusic() {
  if (musicTimer) clearInterval(musicTimer);
}

function toggleMusic() {
  musicOn = !musicOn;
  document.getElementById("musicButton").textContent =
    musicOn ? "🔊 الموسيقى" : "🔇 الموسيقى";

  if (musicOn && playing) startMusic();
  else stopMusic();
}

function deathSound() {
  playTone(180, 0.35, "sawtooth", 0.07);
  setTimeout(() => playTone(100, 0.5, "sawtooth", 0.06), 180);
}

// اختيار شكل اللاعب
function chooseShape(shape, button) {
  selectedShape = shape;

  document.querySelectorAll(".shapes button").forEach(b => {
    b.classList.remove("selected");
  });

  button.classList.add("selected");
  draw();
}

// الخلفية
function drawBackground() {
  const gradient = ctx.createLinearGradient(0, 0, 0, 560);
  gradient.addColorStop(0, "#10163c");
  gradient.addColorStop(1, "#030614");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 420, 560);

  // النجوم
  stars.forEach(star => {
    ctx.fillStyle = "white";
    ctx.globalAlpha = 0.35 + Math.random() * 0.5;

    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();

    if (playing) {
      star.y += star.speed;

      if (star.y > 560) {
        star.y = 0;
        star.x = Math.random() * 420;
      }
    }
  });

  ctx.globalAlpha = 1;

  // خطوط جانبية
  ctx.shadowBlur = 15;
  ctx.shadowColor = "#00eaff";
  ctx.strokeStyle = "#00eaff";
  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.moveTo(5, 0);
  ctx.lineTo(5, 560);
  ctx.moveTo(415, 0);
  ctx.lineTo(415, 560);
  ctx.stroke();

  ctx.shadowBlur = 0;
}

// رسم اللاعب
function drawPlayer() {
  ctx.save();

  ctx.translate(player.x + player.size / 2, player.y + player.size / 2);

  ctx.shadowBlur = 20;
  ctx.shadowColor = "#00eaff";
  ctx.fillStyle = "#00eaff";

  if (selectedShape === "square") {
    ctx.fillRect(-15, -15, 30, 30);
  }

  if (selectedShape === "circle") {
    ctx.beginPath();
    ctx.arc(0, 0, 15, 0, Math.PI * 2);
    ctx.fill();
  }

  if (selectedShape === "diamond") {
    ctx.rotate(Math.PI / 4);
    ctx.fillRect(-12, -12, 24, 24);
  }

  if (selectedShape === "star") {
    ctx.beginPath();

    for (let i = 0; i < 10; i++) {
      const radius = i % 2 === 0 ? 17 : 8;
      const angle = i * Math.PI / 5 - Math.PI / 2;
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius;

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }

    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

// رسم العقبات
function drawObstacles() {
  obstacles.forEach(o => {
    ctx.save();

    ctx.shadowBlur = 14;
    ctx.shadowColor = "#ff245f";
    ctx.fillStyle = "#ff245f";

    ctx.fillRect(o.x, o.y, o.width, o.height);

    ctx.restore();
  });
}

// إنشاء العقبات
function createObstacle() {
  const width = 35 + Math.random() * 35;

  obstacles.push({
    x: 15 + Math.random() * (390 - width),
    y: -35,
    width: width,
    height: 25,
    speed: 3 + Math.random() * 1.5,
    counted: false
  });
}

// التصادم
function collision(a, b) {
  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}

// نهاية اللعبة
function endGame() {
  playing = false;
  gameOver = true;

  stopMusic();
  deathSound();

  if (score > best) {
    best = score;
    localStorage.setItem("cosmicBest", best);
    bestText.textContent = best;
  }

  draw();

  ctx.fillStyle = "rgba(0,0,0,0.75)";
  ctx.fillRect(0, 0, 420, 560);

  ctx.textAlign = "center";

  ctx.shadowBlur = 15;
  ctx.shadowColor = "#ff245f";
  ctx.fillStyle = "#ff245f";
  ctx.font = "bold 38px Arial";
  ctx.fillText("GAME OVER", 210, 245);

  ctx.shadowBlur = 0;
  ctx.fillStyle = "white";
  ctx.font = "22px Arial";
  ctx.fillText("Score: " + score, 210, 295);

  ctx.font = "17px Arial";
  ctx.fillText("Press START to play again", 210, 345);
}

// بدء اللعبة
function startGame() {
  initAudio();

  score = 0;
  scoreText.textContent = score;

  player.x = 190;
  obstacles = [];
  frame = 0;

  playing = true;
  gameOver = false;

  startMusic();
  draw();
}

// تحديث اللعبة
function update() {
  if (!playing) return;

  frame++;

  if (keys["ArrowLeft"] || keys["a"] || keys["A"]) {
    player.x -= player.speed;
  }

  if (keys["ArrowRight"] || keys["d"] || keys["D"]) {
    player.x += player.speed;
  }

  player.x = Math.max(12, Math.min(378, player.x));

  if (frame % 55 === 0) {
    createObstacle();
  }

  obstacles.forEach(o => {
    o.y += o.speed;

    if (!o.counted && o.y > player.y + player.size) {
      o.counted = true;
      score++;
      scoreText.textContent = score;
    }

    if (collision(player, o)) {
      endGame();
    }
  });

  obstacles = obstacles.filter(o => o.y < 580);

  draw();
}

// الرسم
function draw() {
  drawBackground();
  drawPlayer();
  drawObstacles();
}

// حلقة اللعبة
function loop() {
  update();
  requestAnimationFrame(loop);
}

// التحكم بالكيبورد
document.addEventListener("keydown", e => {
  keys[e.key] = true;

  if (["ArrowLeft", "ArrowRight", " "].includes(e.key)) {
    e.preventDefault();
  }
});

document.addEventListener("keyup", e => {
  keys[e.key] = false;
});

// أزرار الموبايل
function holdButton(id, key) {
  const button = document.getElementById(id);

  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[key] = true;
  });

  button.addEventListener("pointerup", () => {
    keys[key] = false;
  });

  button.addEventListener("pointerleave", () => {
    keys[key] = false;
  });

  button.addEventListener("pointercancel", () => {
    keys[key] = false;
  });
}

holdButton("leftBtn", "ArrowLeft");
holdButton("rightBtn", "ArrowRight");

draw();
loop();
</script>

</body>
</html>
